spring.application.name=backend
server.port=${PORT:8080}
# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/atelier_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:atelier_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:atelier_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Allow serverless PostgreSQL providers such as Neon to scale to zero.
# HikariCP 6.x otherwise keeps a fixed-size idle pool alive and pings it every 2 minutes.
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.keepalive-time=${DB_POOL_KEEPALIVE_TIME:0}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:60000}

# JPA
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true

# User
app.admin.bootstrap-enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}

#JWT
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:3600000}

# CORS
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Login protection
app.security.login.max-failed-attempts=${LOGIN_MAX_FAILED_ATTEMPTS:5}
app.security.login.attempt-window-minutes=${LOGIN_ATTEMPT_WINDOW_MINUTES:15}
app.security.login.lock-duration-minutes=${LOGIN_LOCK_DURATION_MINUTES:15}

# API documentation
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
