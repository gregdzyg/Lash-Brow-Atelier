spring.application.name=backend
server.port=${PORT:8080}
# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/atelier_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:atelier_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:atelier_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true

# User
app.admin.bootstrap-enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}

#JWT
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:3600000}

# CORS
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# API documentation
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}